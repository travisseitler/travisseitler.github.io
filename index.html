<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Small projects by Travis Seitler." />
    <title>Travis Seitler · Projects</title>
    <style>
      :root {
        color: #303c2c;
        background: #f7f5ee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(640px, calc(100% - 48px)); margin: 12vh auto 48px; }
      .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #626d59; }
      h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
      h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.1; margin: 24px 0 16px; }
      h2 { font-size: 30px; margin: 0 0 12px; }
      p { line-height: 1.7; }
      .intro { color: #626d59; margin-bottom: 48px; }
      article { border-top: 1px solid #dcded1; border-bottom: 1px solid #dcded1; padding: 32px 0; }
      article p { margin: 0 0 24px; }
      a { color: #50673d; text-underline-offset: 5px; }
      a:hover { color: #303c2c; }
      a:focus-visible { outline: 3px solid #50673d; outline-offset: 5px; }
      footer { margin-top: 32px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Travis Seitler</p>
      <h1>A place for small projects.</h1>
      <p class="intro">A home for the things I’m building, starting with this one.</p>
      <article aria-labelledby="jot-and-tittle-title">
        <h2 id="jot-and-tittle-title">Jot &amp; Tittle</h2>
        <p>A quiet place to see your journey through Scripture. A local-first, verse-level Bible reading journal.</p>
        <a href="/jot-and-tittle/">Explore Jot &amp; Tittle <span aria-hidden="true">→</span></a>
      </article>
      <footer><a href="https://github.com/travisseitler">Find me on GitHub</a></footer>
    </main>
  </body>
</html>
